# dsh-spirit 组合包层：安装（dsh plugin --profile <name> add dsh-spirit）后自动挂载
# 插件行，无需再手改 profile 的 cordis.patch.yml。
# 覆盖配置请在 profile 自己的 cordis.patch.yml 里写顶层裸 patch（直接 id:，不要包
# insert:，同 id 再 insert 会报 duplicate loader entry id 启动失败；键按行整体替换，不深合并）：
#   - id: dsh-spirit
#     name: dsh-spirit
#     config: { enabled: true }
- insert:
    - id: dsh-spirit
      name: dsh-spirit
      # config:                      # 全部字段有默认值，按需覆盖（键名见 src/contract.ts 单源）：
      #   enabled: true              # 部署总上限（false 即物理离场）
      #   dataDir: ''                # 默认 $DSH_HOME/spirit
      #   persona:
      #     enabled: true
      #     budgetBytes: 700         # 人格区进系统提示的字节顶
      #   card:
      #     maxBytes: 512            # 回忆卡总顶（不能再小：极端档的「非医疗声明」不许被预算掉）
      #     recentK: 2               # 「刚刚」段最多几条
      #     crossSessionM: 4         # 新会话首轮读上一会话几条（0 = 关闭跨会话基调）
      #   recall:
      #     timeoutMs: 800           # 检索段预算，超时只丢该段不拖慢对话
      #     maxResults: 3
      #     maxCharsPerEntry: 120
      #     halfLifeMs: 5400000      # 条目近因半衰期（缺省 90 分钟，经验值可调）
      #     fadeEnabled: false       # 滑窗淡出总闸（v0.2 新能力，缺省关=与 v0.1 逐字节一致；灰度闸）
      #     fadeHalfLifeMs: 5400000  # 淡出档位的 Δt 尺度（与 prime 同式 0.5^(Δt/halfLife)；情绪尺度缺省；
      #                              #   调参 SOP 见 README：held 占比过高→拉长，重发率升高→加宽量化档）
      #     fadeFullMinScore: 550    # full 档分数地板（千分位；m=(salience/2)×注意力衰减，反馈不回灌 m）
      #     fadeGistMinScore: 250    # gist 档分数地板（千分位；低于它 ⇒ held 不上卡，库内仍在）
      #     gistMinSalience: 1       # gist 的最低 salience（弱条目直接 held，宁缺毋造）
      #     feedbackEnabled: true    # 人工反馈只重排不回灌派生分（两轴分离，移植 prime recall-usage）
      #   ledger:
      #     enabled: false           # 未竟账（会话收尾结构计数，新会话开局带出一行；缺省关）
      #     maxAgeMs: 604800000      # 账行过期不再带出（缺省 7 天顶，配合有顶 GC）
      #   bias:
      #     enabled: false           # 条件化（强负体验→同类动作短期抑制，三档词；缺省关）
      #     halfLifeMs: 5400000      # 派生缓存表的过期尺度
      #   live:                      # volatile 热更节（改值不重启；0.2.0-rc.2 web 壳不渲染其表单）
      #     fadeEnabled: false       # 与静态 recall.fadeEnabled 取与：淡出/未竟/条件化统一灰度总开关
      #     fadeHalfLifeMs: 5400000  # 面板可调的窗口尺度（六腿的 volatile 腿）
      #   tier:
      #     stepCap: 1               # 单轮最多跨几格（防人格抽动）
      #     staleAfterMs: 600000     # 越此无新条目 ⇒ 退中性档
      #   journal:
      #     retentionDays: 90
      #     dryRun: true             # 清理默认干跑
      #   capture:
      #     userSnippet: false       # 用户原文默认不入库
      #   drsc:
      #     enabled: true            # 历史路依赖 DRSC；缺席即整段省略，不影响近因路
